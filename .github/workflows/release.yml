name: Release

# Se dispara al empujar una etiqueta con forma vX.Y.Z (por ejemplo v1.2.0).
# Compila Anaquel para Windows y Linux, y publica un Release en GitHub como
# publicado con los instaladores para Windows y Linux.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Calcular versión a partir de la etiqueta
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compilar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Anaquel ${{ steps.version.outputs.version }}"
          releaseBody: |
            ## Novedades

            - La ventana se abre centrada y ocupa el 90 % del área útil de la pantalla.
            - La biblioteca usa SQLite con tablas separadas para libros y audiolibros; la configuración visual sigue en JSON.
            - Valoración numérica del 1 al 10 y estados simplificados.
            - Interfaz simplificada: sin saga, favoritos, editorial, páginas ni duración de audiolibros.
            - Incluye instaladores para Windows y Linux.
          releaseDraft: false
          prerelease: false
